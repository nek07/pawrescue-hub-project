[project]
name = "pawrescue-api"
version = "0.1.0"
description = "Paw Rescue Hub API"
authors = [
    { name = "abylay", email = "taitoleuov.a@telecom.kz" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "boto3>=1.43.108",
    "fastapi[standard]>=0.142.2",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7.5",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "redis>=5.3.1",
    "sentry-sdk[fastapi]>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx-ws>=0.9.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC", "SIM", "PT", "RUF"]
# Кириллица в строках и комментариях — норма для проекта
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*", "arq.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
